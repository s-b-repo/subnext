# Bad-pattern gate. Section P flags a struct that derives `Debug` while holding
# a credential-named field (secret/token/password) — a key printed by `{:?}`.
# It found a real leaked signing key the first time it ran (see AUDIT.md), has
# six known token-*count* false positives waived in-src by `// audit-allow:`,
# and is the one section narrow enough to gate on. See AUDIT.md § Gating.
name: bad-pattern audit
on:
  push:
    paths: ['src/**', 'scripts/audit-bad-patterns.sh', '.github/workflows/audit.yml']
  pull_request:
    paths: ['src/**', 'scripts/audit-bad-patterns.sh', '.github/workflows/audit.yml']
jobs:
  section-p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate on section P (Debug over a credential field)
        run: scripts/audit-bad-patterns.sh --strict --section P --strict-sections P
