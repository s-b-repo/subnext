# Bad-pattern gate. Section P flags a struct that derives `Debug` while holding
# a secret/token/password field (compound names like access_token included;
# not key/credential/passwd — see AUDIT.md § Gating) — a value printed by `{:?}`.
# It found a real leaked signing key the first time it ran (see AUDIT.md). The
# job runs scripts/audit-selftest.sh, which is the gate PLUS a planted-leak
# fixture proving the gate can still fire — a gate that only ever passes is
# indistinguishable from a broken one. See AUDIT.md § Gating.
name: bad-pattern audit
on:
  push:
    paths: ['src/**', 'scripts/audit-bad-patterns.sh', 'scripts/audit-selftest**', '.github/workflows/audit.yml']
  pull_request:
    paths: ['src/**', 'scripts/audit-bad-patterns.sh', 'scripts/audit-selftest**', '.github/workflows/audit.yml']
jobs:
  section-p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Section-P gate + firing self-test
        run: scripts/audit-selftest.sh
