<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="archtitle archdesc" class="fig">
<title id="archtitle">DCR per-turn data flow</title>
<desc id="archdesc">Ingested bytes become immutable spans and typed state nodes. A query is classified, seeded, expanded along edges, level-assigned, and bounded by the attention budget before reaching the model, which may escalate a node back to raw bytes.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#5b5b58"/>
</marker>
<marker id="ar-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/>
</marker>
</defs>
<g font-family="'IBM Plex Sans',system-ui,sans-serif" font-size="11" fill="#111">

<text x="8" y="30" font-size="10" fill="#5b5b58" font-weight="600">MEMORY RUNTIME</text>
<rect x="8" y="38" width="744" height="122" rx="7" fill="#f6f7f9" stroke="#d5d8dd"/>

<rect x="26" y="58" width="118" height="38" rx="5" fill="#fff" stroke="#9aa0a8"/>
<text x="85" y="74" text-anchor="middle" font-size="10.5">ingest event</text>
<text x="85" y="88" text-anchor="middle" font-size="9" fill="#5b5b58">message · tool result</text>

<rect x="176" y="58" width="126" height="38" rx="5" fill="#fff" stroke="#9aa0a8"/>
<text x="239" y="74" text-anchor="middle" font-size="10.5">L0 spans</text>
<text x="239" y="88" text-anchor="middle" font-size="9" fill="#5b5b58">immutable, addressed</text>

<rect x="334" y="50" width="150" height="54" rx="5" fill="#fff" stroke="#9aa0a8"/>
<text x="409" y="70" text-anchor="middle" font-size="10.5">typed state graph</text>
<text x="409" y="84" text-anchor="middle" font-size="9" fill="#5b5b58">claims · decisions · edges</text>
<text x="409" y="96" text-anchor="middle" font-size="9" fill="#5b5b58">provenance · supersession</text>

<rect x="516" y="50" width="212" height="54" rx="5" fill="#fff" stroke="#9aa0a8"/>
<text x="622" y="68" text-anchor="middle" font-size="10.5">representation ladder</text>
<text x="622" y="84" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#5b5b58">L0 bytes · L1 summary</text>
<text x="622" y="96" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#5b5b58">L2 state · L3 computed</text>

<text x="622" y="124" text-anchor="middle" font-size="9" fill="#5b5b58">built lazily, cached per node</text>
<text x="239" y="124" text-anchor="middle" font-size="9" fill="#5b5b58">eager — everything else is not</text>

<line x1="144" y1="77" x2="172" y2="77" stroke="#5b5b58" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="302" y1="77" x2="330" y2="77" stroke="#5b5b58" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="484" y1="77" x2="512" y2="77" stroke="#5b5b58" stroke-width="1.4" marker-end="url(#ar)"/>

<text x="8" y="196" font-size="10" fill="#5b5b58" font-weight="600">PER-TURN PLAN</text>
<rect x="8" y="204" width="744" height="60" rx="7" fill="#fff" stroke="#d5d8dd"/>

<g font-size="10">
<rect x="24" y="220" width="86" height="28" rx="5" fill="#eef4fc" stroke="#2a78d6"/>
<text x="67" y="238" text-anchor="middle">classify</text>
<rect x="128" y="220" width="86" height="28" rx="5" fill="#eef4fc" stroke="#2a78d6"/>
<text x="171" y="238" text-anchor="middle">seed</text>
<rect x="232" y="220" width="98" height="28" rx="5" fill="#eef4fc" stroke="#2a78d6"/>
<text x="281" y="238" text-anchor="middle">expand edges</text>
<rect x="348" y="220" width="104" height="28" rx="5" fill="#eef4fc" stroke="#2a78d6"/>
<text x="400" y="238" text-anchor="middle">assign levels</text>
<rect x="470" y="220" width="118" height="28" rx="5" fill="#dbe8fa" stroke="#2a78d6" stroke-width="1.6"/>
<text x="529" y="238" text-anchor="middle" font-weight="600">knapsack ≤ B</text>
<rect x="606" y="220" width="130" height="28" rx="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text x="671" y="238" text-anchor="middle" font-weight="600">working set → model</text>
</g>

<line x1="110" y1="234" x2="124" y2="234" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ar-acc)"/>
<line x1="214" y1="234" x2="228" y2="234" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ar-acc)"/>
<line x1="330" y1="234" x2="344" y2="234" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ar-acc)"/>
<line x1="452" y1="234" x2="466" y2="234" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ar-acc)"/>
<line x1="588" y1="234" x2="602" y2="234" stroke="#2a78d6" stroke-width="1.4" marker-end="url(#ar-acc)"/>

<path d="M409 104 L409 172 L300 172 L300 216" fill="none" stroke="#5b5b58" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>
<path d="M622 104 L622 188 L400 188 L400 216" fill="none" stroke="#5b5b58" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ar)"/>

<path d="M671 248 L671 278 L171 278 L171 252" fill="none" stroke="#eb6834" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="286" y="269" width="270" height="14" fill="#fff"/>
<text x="421" y="280" text-anchor="middle" font-size="9.5" fill="#eb6834" font-weight="600">#ESCALATE &#8212; re-plan this node at L0</text>
</g>
</svg>
