<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sctitle scdesc" class="fig">
<title id="sctitle">History size and working-set size against corpus size</title>
<desc id="scdesc">Two stacked panels sharing an x-axis of 100, 300, 1000 and 3000 turns. Total history rises from 8,482 to 283,253 tokens. The mean working set stays between 404 and 422 tokens.</desc>
<g font-family="'IBM Plex Sans',system-ui,sans-serif" fill="#111">

<text x="76" y="26" font-size="11.5" font-weight="600">Total history (tokens)</text>
<text x="76" y="40" font-size="9.5" fill="#5b5b58">grows 33× across the sweep</text>

<g stroke="#e4e6ea" stroke-width="1">
<line x1="76" y1="160" x2="716" y2="160"/><line x1="76" y1="122" x2="716" y2="122"/>
<line x1="76" y1="84" x2="716" y2="84"/><line x1="76" y1="46" x2="716" y2="46"/>
</g>
<g font-size="9" fill="#5b5b58" text-anchor="end">
<text x="68" y="163">0</text><text x="68" y="125">100k</text>
<text x="68" y="87">200k</text><text x="68" y="49">300k</text>
</g>

<polyline points="110,156.7 300,149.5 490,124.2 680,51.4" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>
<g fill="#2a78d6">
<circle cx="110" cy="156.7" r="4.5" stroke="#fff" stroke-width="2"/>
<circle cx="300" cy="149.5" r="4.5" stroke="#fff" stroke-width="2"/>
<circle cx="490" cy="124.2" r="4.5" stroke="#fff" stroke-width="2"/>
<circle cx="680" cy="51.4" r="4.5" stroke="#fff" stroke-width="2"/>
</g>
<text x="680" y="42" font-size="9.5" fill="#111" text-anchor="end" font-weight="600">283,253</text>
<text x="110" y="148" font-size="9.5" fill="#5b5b58" text-anchor="middle">8,482</text>

<text x="76" y="205" font-size="11.5" font-weight="600">Mean working set k (tokens)</text>
<text x="76" y="219" font-size="9.5" fill="#5b5b58">does not move · B_attention = 800</text>

<g stroke="#e4e6ea" stroke-width="1">
<line x1="76" y1="305" x2="716" y2="305"/><line x1="76" y1="265" x2="716" y2="265"/>
<line x1="76" y1="225" x2="716" y2="225"/>
</g>
<g font-size="9" fill="#5b5b58" text-anchor="end">
<text x="68" y="308">0</text><text x="68" y="268">250</text><text x="68" y="228">500</text>
</g>

<polyline points="110,237.5 300,238.3 490,240.4 680,238.0" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round"/>
<g fill="#eb6834">
<rect x="106" y="233.5" width="8" height="8" stroke="#fff" stroke-width="2"/>
<rect x="296" y="234.3" width="8" height="8" stroke="#fff" stroke-width="2"/>
<rect x="486" y="236.4" width="8" height="8" stroke="#fff" stroke-width="2"/>
<rect x="676" y="234.0" width="8" height="8" stroke="#fff" stroke-width="2"/>
</g>
<text x="680" y="228" font-size="9.5" fill="#111" text-anchor="end" font-weight="600">418.7</text>
<text x="110" y="229" font-size="9.5" fill="#5b5b58" text-anchor="middle">422.1</text>

<g font-size="9.5" fill="#5b5b58" text-anchor="middle">
<text x="110" y="322">100 turns</text><text x="300" y="322">300</text>
<text x="490" y="322">1,000</text><text x="680" y="322">3,000</text>
</g>
</g>
</svg>
