      - State Indexer: architecture/state-indexer.md
      - Memory Graph: architecture/memory-graph.md
      - Relevance Planner: architecture/relevance-planner.md
      - Decision Policy: architecture/decision-policy.md
      - Provenance: architecture/provenance.md
      - Context integrity: architecture/context-integrity.md
      - Failure modes: architecture/failure-modes.md
      - Workspace rebuild: architecture/workspace-rebuild.md
