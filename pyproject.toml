[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcr-runtime"
version = "0.1.0"
description = "Dynamic Context Runtime — unlimited external state plus a small, planned working set"
readme = "IMPLEMENTATION.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
keywords = ["context", "llm", "memory", "retrieval", "context-rot", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.scripts]
dcr = "dcr.cli:main"

[tool.setuptools]
packages = ["dcr"]

[tool.setuptools.package-data]
dcr = ["py.typed"]
